<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ nick }} — Zenith's Academy</title>
<style>
  :root {
    --bg: #0b0a0d;
    --bg-panel: #131116;
    --border: #2a2630;
    --gold: #f0b429;
    --gold-soft: #f0b42933;
    --red: #d6453d;
    --text: #f4f1ea;
    --text-dim: #8d8794;
    --green: #5fd07a;
    --font-display: 'Bebas Neue', 'Oswald', Impact, sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, var(--gold-soft), transparent);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(30px, 8vw, 42px);
    letter-spacing: 1px;
    color: var(--text);
    margin-bottom: 6px;
    word-break: break-word;
  }
  .rank {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .elo {
    font-family: var(--font-display);
    font-size: 48px;
    color: var(--gold);
    line-height: 1;
  }
  .elo-lbl {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .chip {
    background: #1a171e;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 6px;
  }
  .chip .v { font-family: var(--font-display); font-size: 22px; }
  .chip .l { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .wl { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }
  .wl .w { color: var(--green); font-weight: 600; }
  .wl .l { color: var(--red); font-weight: 600; }
  .so2id { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); margin-top: 18px; }
  footer { margin-top: 22px; font-size: 11px; color: var(--text-dim); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Zenith's Academy — Oyunçu Profili</div>
    <h1>{{ nick }}</h1>
    <div class="rank" style="color: rgb({{ rank_color[0] }},{{ rank_color[1] }},{{ rank_color[2] }}); border-color: rgb({{ rank_color[0] }},{{ rank_color[1] }},{{ rank_color[2] }});">
      {{ rank_emoji }} {{ rank_name }}
    </div>

    <div class="elo">{{ elo }}</div>
    <div class="elo-lbl">ELO</div>

    <div class="wl">
      <span class="w">{{ wins }}Q</span> / <span class="l">{{ losses }}M</span>
      · {{ matches }} matç · {{ win_rate }}% qazanma
    </div>

    <div class="grid">
      <div class="chip"><div class="v">{{ kills }}</div><div class="l">Kill</div></div>
      <div class="chip"><div class="v">{{ assists }}</div><div class="l">Assist</div></div>
      <div class="chip"><div class="v">{{ deaths }}</div><div class="l">Death</div></div>
    </div>

    <div class="so2id">SO2 ID: {{ so2_id }}</div>
    <footer>zenith's academy · faceit 2v2</footer>
  </div>
</body>
</html>
