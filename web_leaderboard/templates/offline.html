<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bağlantı yoxdur — Zenith's Academy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0a0d;
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, #8a5ce633, transparent);
    color: #f4f1ea;
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 380px; }
  .icon { font-size: 52px; margin-bottom: 18px; opacity: 0.7; }
  h1 { font-family: 'Bebas Neue', 'Oswald', Impact, sans-serif; font-size: 30px; letter-spacing: 1px; margin-bottom: 12px; }
  p { color: #8d8794; font-size: 14px; line-height: 1.6; margin-bottom: 22px; }
  button {
    background: #8a5ce6;
    color: #0b0a0d;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Bağlantı Yoxdur</h1>
    <p>Zenith's Academy-yə qoşulmaq üçün internet bağlantısı lazımdır. Zəhmət olmasa bağlantınızı yoxlayıb yenidən cəhd edin.</p>
    <button onclick="window.location.reload()">Yenidən Cəhd Et</button>
  </div>
</body>
</html>
