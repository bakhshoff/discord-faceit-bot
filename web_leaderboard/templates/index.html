<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith's Academy Leaderboard</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8a5ce6">
<style>
  :root {
    --bg: #0b0a0d;
    --bg-panel: #131116;
    --bg-row-alt: #17141a;
    --border: #2a2630;
    --gold: #f0b429;
    --gold-soft: #f0b42933;
    --red: #d6453d;
    --text: #f4f1ea;
    --text-dim: #8d8794;
    --green: #5fd07a;
    --font-display: 'Bebas Neue', 'Oswald', Impact, sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--gold-soft), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 39px, #ffffff05 39px, #ffffff05 40px);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  @font-face {
    font-family: 'Bebas Neue';
    src: local('Bebas Neue');
  }

  header {
    padding: 56px 24px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: "";
    position: absolute;
    top: -50%;
    left: 50%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--gold-soft), transparent 70%);
    transform: translateX(-50%);
    pointer-events: none;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(40px, 8vw, 72px);
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1;
    background: linear-gradient(180deg, #fff 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin-top: 12px;
    color: var(--text-dim);
    font-size: 15px;
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 20px 0;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px 12px 40px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--gold);
  }

  .search-box::before {
    content: "⌕";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 16px;
  }

  .sort-select {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
    outline: none;
  }

  .stats-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat-chip {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    flex: 1;
    min-width: 120px;
  }

  .stat-chip .label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-chip .value {
    font-family: var(--font-display);
    font-size: 26px;
    color: var(--gold);
    margin-top: 2px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-panel);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  thead th {
    text-align: left;
    padding: 14px 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  thead th:hover { color: #fff; }

  thead th.sorted::after {
    content: " ▾";
    color: var(--gold);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }

  tbody tr:nth-child(even) { background: var(--bg-row-alt); }

  tbody tr:hover { background: var(--gold-soft); }

  td {
    padding: 14px 16px;
    font-size: 14px;
    white-space: nowrap;
  }

  .rank-cell {
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-weight: 600;
  }

  .rank-1 .rank-cell { color: var(--gold); }
  .rank-2 .rank-cell { color: #c8c8c8; }
  .rank-3 .rank-cell { color: #cd7f32; }

  .player-cell {
    font-weight: 600;
    color: var(--text);
  }

  .id-cell {
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-size: 13px;
  }

  .elo-cell {
    font-family: var(--font-mono);
    color: var(--green);
    font-weight: 700;
    font-size: 15px;
  }

  .wr-cell {
    font-family: var(--font-mono);
    color: var(--text-dim);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--font-mono);
  }

  .refresh-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .rank-move {
    font-size: 11px;
    margin-left: 6px;
    font-family: var(--font-mono);
  }
  .rank-move.up { color: var(--green); }
  .rank-move.down { color: var(--red); }

  @keyframes rowFlash {
    0% { background: var(--gold-soft); }
    100% { background: transparent; }
  }
  tr.flash { animation: rowFlash 1.6s ease-out; }

  .skeleton-row td { padding: 14px 16px; }
  .skeleton-block {
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, #1a171e 25%, #221e28 37%, #1a171e 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (max-width: 600px) {
    .id-cell { display: none; }
    h1 { font-size: 36px; }
  }

  #viewerBadge {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 5;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #viewerBadge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }

  tr.you-are-here {
    outline: 2px solid var(--gold);
    outline-offset: -2px;
    animation: youHereFlash 2s ease-in-out 2;
  }
  @keyframes youHereFlash {
    0%, 100% { background: transparent; }
    50% { background: var(--gold-soft); }
  }

  .capsule-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .capsule-panel h2 {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    color: var(--text-dim);
  }
  .capsule-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .capsule-item {
    background: #1a171e;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font-mono);
    transition: border-color 0.2s;
  }
  .capsule-item:hover, .capsule-item.active { border-color: var(--gold); color: var(--gold); }
  .capsule-detail-row {
    display: flex; justify-content: space-between; font-size: 13px;
    padding: 8px 4px; border-bottom: 1px solid var(--border);
  }
  .capsule-detail-row:last-child { border-bottom: none; }
  .capsule-empty { font-size: 12px; color: var(--text-dim); }
  .capsule-toggle {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 16px;
  }
  .capsule-toggle:hover { border-color: var(--gold); color: var(--gold); }

  body { opacity: 0; transition: opacity 0.35s ease; }
  body.ready { opacity: 1; }

  #ticker {
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    overflow: hidden;
    white-space: nowrap;
    padding: 8px 0;
  }
  #ticker .ticker-track {
    display: inline-block;
    padding-left: 100%;
    animation: tickerScroll 40s linear infinite;
  }
  #ticker .ticker-item { display: inline-block; padding: 0 28px; font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
  #ticker .ticker-item .w { color: var(--green); font-weight: 700; }
  #ticker .ticker-item .l { color: var(--red); }
  @keyframes tickerScroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  #soundToggle, #paletteBtn {
    position: fixed;
    top: 18px;
    z-index: 5;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #soundToggle { right: 64px; }
  #paletteBtn { right: 18px; }
  #soundToggle:hover, #paletteBtn:hover { border-color: var(--gold); }
  #soundToggle.muted { opacity: 0.45; }

  #cmdPalette {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: flex-start;
    justify-content: center;
    padding-top: 12vh;
  }
  #cmdPalette.show { display: flex; }
  #cmdPaletteBox {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 480px;
    max-height: 60vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #cmdPaletteInput {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    padding: 16px 18px;
    font-size: 15px;
    outline: none;
    font-family: var(--font-body);
  }
  #cmdPaletteResults { overflow-y: auto; }
  .cmd-item { padding: 12px 18px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; }
  .cmd-item:hover, .cmd-item.sel { background: var(--gold-soft); }
  .cmd-item .elo { color: var(--gold); font-family: var(--font-mono); }

  .side-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 700px) { .side-panels { grid-template-columns: 1fr; } }
  .side-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .side-panel h3 { font-family: var(--font-display); font-size: 16px; color: var(--text-dim); margin-bottom: 10px; letter-spacing: 0.5px; }
  .rising-star-body { display: flex; align-items: center; gap: 12px; }
  .rising-star-body .rs-nick { font-weight: 700; font-size: 15px; }
  .rising-star-body .rs-gain { color: var(--green); font-family: var(--font-mono); font-weight: 700; }
  .rising-star-empty { font-size: 12px; color: var(--text-dim); }
  .donut-wrap { display: flex; align-items: center; gap: 14px; }
  .donut-legend { font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
  .donut-legend .li { display: flex; align-items: center; gap: 6px; }
  .donut-legend .sw { width: 8px; height: 8px; border-radius: 2px; }

  #auroraBg {
    position: fixed;
    inset: -20%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%, var(--gold-soft), transparent 45%),
      radial-gradient(circle at 80% 60%, rgba(95,208,122,0.08), transparent 45%),
      radial-gradient(circle at 40% 90%, var(--gold-soft), transparent 50%);
    filter: blur(50px);
    animation: auroraShift 24s ease-in-out infinite alternate;
  }
  @keyframes auroraShift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(3%, -2%) scale(1.08); }
    100% { transform: translate(-3%, 2%) scale(1); }
  }

  button { position: relative; overflow: hidden; }
  .ripple-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(2.5); opacity: 0; } }

  .elo-cell.pulse-up { animation: pulseUp 1.4s ease-out; }
  .elo-cell.pulse-down { animation: pulseDown 1.4s ease-out; }
  @keyframes pulseUp { 0% { color: var(--green); text-shadow: 0 0 8px var(--green); } 100% { color: var(--green); text-shadow: none; } }
  @keyframes pulseDown { 0% { color: var(--red); text-shadow: 0 0 8px var(--red); } 100% { color: var(--green); text-shadow: none; } }

  .subtitle .cursor { display: inline-block; width: 2px; background: var(--gold); animation: blink 0.9s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  #miniProfilePopup {
    display: none;
    position: fixed;
    z-index: 40;
    background: var(--bg-panel);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12px;
    min-width: 180px;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #miniProfilePopup .mp-nick { font-family: var(--font-display); font-size: 16px; margin-bottom: 4px; }
  #miniProfilePopup .mp-row { display: flex; justify-content: space-between; color: var(--text-dim); padding: 2px 0; }
  #miniProfilePopup .mp-row b { color: var(--text); font-family: var(--font-mono); }

  #snowCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; display: none; }

  #matchToast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 45;
    background: var(--bg-panel);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    max-width: 260px;
    transform: translateX(320px);
    transition: transform 0.35s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #matchToast.show { transform: translateX(0); }
  #matchToast .mt-title { font-family: var(--font-display); font-size: 14px; color: var(--gold); margin-bottom: 4px; }

  /* ── Yuxarı yüklənmə zolağı ── */
  #loadingBar { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: var(--gold); z-index: 60; transition: width 0.3s ease, opacity 0.3s ease; opacity: 0; }
  #loadingBar.active { opacity: 1; }

  /* ── Sürüşən Naviqasiya Paneli ── */
  header { transition: transform 0.3s ease; }
  header.nav-hidden { transform: translateY(-100%); }

  /* ── Xüsusi skrollbar + mətn seçimi ── */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 6px; }
  html { scrollbar-color: var(--gold) var(--bg); scrollbar-width: thin; }
  ::selection { background: var(--gold); color: #0b0a0d; }

  /* ── Yuxarı qayıt düyməsi ── */
  #backToTop {
    position: fixed; bottom: 24px; left: 24px; z-index: 45;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--bg-panel); border: 1px solid var(--border); color: var(--gold);
    cursor: pointer; font-size: 18px; display: none; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s, border-color 0.2s;
  }
  #backToTop.show { display: flex; }
  #backToTop.visible { opacity: 1; }
  #backToTop:hover { border-color: var(--gold); }

  /* ── Rütbəyə görə filtr çipləri ── */
  .rank-filter-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .rank-chip {
    background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  .rank-chip:hover { border-color: var(--gold); }
  .rank-chip.active { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }

  /* ── İlk dəfə gələnlər üçün tur ── */
  #tourOverlay { display: none; position: fixed; inset: 0; z-index: 70; }
  #tourOverlay.show { display: block; }
  #tourOverlay .tour-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); }
  .tour-tip {
    position: absolute; max-width: 260px; background: var(--bg-panel); border: 1px solid var(--gold);
    border-radius: 10px; padding: 14px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .tour-tip .tt-title { font-family: var(--font-display); font-size: 15px; color: var(--gold); margin-bottom: 6px; letter-spacing: 0.5px; }
  .tour-tip .tt-actions { display: flex; justify-content: space-between; margin-top: 10px; align-items: center; }
  .tour-tip .tt-actions button {
    background: var(--gold); color: #0b0a0d; border: none; padding: 6px 14px; border-radius: 6px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .tour-tip .tt-skip { background: none; color: var(--text-dim); font-weight: 400; text-decoration: underline; padding: 6px 4px; }
  .tour-highlight { position: relative; z-index: 71; box-shadow: 0 0 0 4px var(--gold-soft), 0 0 0 9999px rgba(0,0,0,0.55); border-radius: 8px; }

  /* ── Canlı Matç İzləmə Kartı ── */
  #liveMatchesWrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .live-match-card {
    background: var(--bg-panel); border: 1px solid var(--red); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .live-match-card .lm-badge {
    display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px;
    color: var(--red); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
  }
  .live-match-card .lm-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.2s infinite; }
  .live-match-card .lm-teams { font-size: 13px; display: flex; align-items: center; gap: 8px; flex: 1; }
  .live-match-card .lm-teams b { color: var(--text); }
  .live-match-card .lm-timer { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

  /* ── Sürüklə-Burax Sütun Sıralaması ── */
  thead th[draggable="true"] { cursor: grab; }
  thead th.dragging { opacity: 0.4; }
  thead th.drag-over { border-left: 2px solid var(--gold); }

  /* ── 3D Kart Parçalanma Keçidi ── */
  #shatterOverlay {
    position: fixed; inset: 0; z-index: 80; display: grid;
    grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(6, 1fr);
    pointer-events: none;
  }
  #shatterOverlay .shard {
    background: var(--bg); transform: scale(0); opacity: 0;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.4s ease;
  }
  #shatterOverlay.active .shard { transform: scale(1); opacity: 1; }

  /* ── Tam Klaviatura Naviqasiyası (a11y) ── */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px;
  }
  tbody tr[tabindex] { cursor: pointer; }

  /* ── Səs Ekvalayzer Animasiyası ── */
  .eq-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-left: 4px; vertical-align: middle; }
  .eq-bars span { width: 2px; height: 3px; background: var(--gold); border-radius: 1px; }
  .eq-bars.playing span:nth-child(1) { animation: eqBounce 0.4s ease-in-out infinite; }
  .eq-bars.playing span:nth-child(2) { animation: eqBounce 0.4s ease-in-out infinite 0.1s; }
  .eq-bars.playing span:nth-child(3) { animation: eqBounce 0.4s ease-in-out infinite 0.2s; }
  @keyframes eqBounce { 0%, 100% { height: 3px; } 50% { height: 12px; } }
</style>
</head>
<body>

<div id="loadingBar"></div>
<div id="shatterOverlay"></div>
<div id="tourOverlay"><div class="tour-dim"></div></div>
<button id="backToTop" type="button" title="Yuxarı qayıt">↑</button>
<div id="auroraBg"></div>
<canvas id="snowCanvas"></canvas>
<div id="matchToast"></div>
<div id="miniProfilePopup"></div>
<div id="viewerBadge"><span class="dot"></span><span id="viewerCount">1</span> baxır</div>
<button id="soundToggle" type="button" title="Səs effektləri">🔊<span class="eq-bars" id="eqBars"><span></span><span></span><span></span></span></button>
<button id="paletteBtn" type="button" title="Sürətli axtarış (Ctrl+K)">⌘</button>

<div id="cmdPalette">
  <div id="cmdPaletteBox">
    <input id="cmdPaletteInput" type="text" placeholder="Oyunçu axtar... (Ctrl+K)">
    <div id="cmdPaletteResults"></div>
  </div>
</div>

<div id="ticker"><div class="ticker-track" id="tickerTrack"></div></div>

<header>
  <div class="eyebrow">Standoff 2 · Competitive</div>
  <h1>Zenith's Academy Leaderboard</h1>
  <p class="subtitle" id="subtitleText"></p>
</header>

<div class="container">

  <div id="liveMatchesWrap"></div>

  <div class="side-panels">
    <div class="side-panel">
      <h3>🌟 Rising Star (bu gün)</h3>
      <div id="risingStarBody"><span class="rising-star-empty">Yüklənir...</span></div>
    </div>
    <div class="side-panel">
      <h3>🥧 Rütbə Bölgüsü</h3>
      <div class="donut-wrap">
        <svg id="rankDonut" width="90" height="90" viewBox="0 0 90 90"></svg>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>
  </div>

  <button class="capsule-toggle" id="capsuleToggleBtn" type="button">🕰️ Zaman Kapsulu — Keçmiş Sezonlara Bax</button>
  <div class="capsule-panel" id="capsulePanel" style="display:none;">
    <h2>🕰️ Zaman Kapsulu</h2>
    <div class="capsule-list" id="capsuleList"><span class="capsule-empty">Yüklənir...</span></div>
    <div id="capsuleDetail"></div>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="rank-filter-chips" id="rankFilterChips"></div>

  <div class="controls" id="tourControls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Oyunçu adı və ya ID ilə axtar...">
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="elo">ELO-ya görə</option>
      <option value="wins">Qalibə görə</option>
      <option value="win_rate">Win Rate-ə görə</option>
      <option value="matches">Matç sayına görə</option>
    </select>
  </div>

  <table id="leaderboardTable">
    <thead>
      <tr id="tableHeadRow"></tr>
    </thead>
    <tbody id="tableBody">
      <!-- Skeleton loading: ilk data gələnə qədər göstərilir -->
      {% for _ in range(8) %}
      <tr class="skeleton-row">
        <td><div class="skeleton-block" style="width:20px;"></div></td>
        <td><div class="skeleton-block" style="width:120px;"></div></td>
        <td><div class="skeleton-block" style="width:70px;"></div></td>
        <td><div class="skeleton-block" style="width:50px;"></div></td>
        <td><div class="skeleton-block" style="width:24px;"></div></td>
        <td><div class="skeleton-block" style="width:24px;"></div></td>
        <td><div class="skeleton-block" style="width:24px;"></div></td>
        <td><div class="skeleton-block" style="width:44px;"></div></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <div id="emptyState" class="empty-state" style="display:none;">
    Hələ qeydiyyatdan keçən oyunçu yoxdur.
  </div>

  <footer>
    <span class="refresh-dot"></span>Avtomatik yenilənir — 30 saniyədə bir &middot; Zenith's Academy
  </footer>
</div>

<script>
let allPlayers = [];
let totalMatchesFromServer = 0;
let currentSort = 'elo';
let currentSearch = '';
let previousRanks = {};
let previousElos = {};
let firstRenderDone = false;

// ── PWA: service worker qeydiyyatı ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

// ── Düymə Basma Dalğası (Ripple) — bütün düymələr üçün ortaq ───────────────
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const circle = document.createElement('span');
  circle.className = 'ripple-circle';
  circle.style.width = circle.style.height = size + 'px';
  circle.style.left = (e.clientX - rect.left - size / 2) + 'px';
  circle.style.top = (e.clientY - rect.top - size / 2) + 'px';
  btn.appendChild(circle);
  setTimeout(() => circle.remove(), 650);
});

// ── Yazı-maşını Effekti (subtitle) ──────────────────────────────────────────
(function typewriter() {
  const text = 'FACEIT-style reytinq sistemi — ELO-ya görə canlı sıralama';
  const el = document.getElementById('subtitleText');
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = ' ';
  function tick() {
    if (i <= text.length) {
      el.textContent = text.slice(0, i);
      el.appendChild(cursor);
      i++;
      setTimeout(tick, 22);
    } else {
      setTimeout(() => cursor.remove(), 1500);
    }
  }
  tick();
})();

// ── Hover Mini-Profil ────────────────────────────────────────────────────────
const miniPopup = document.getElementById('miniProfilePopup');
document.addEventListener('mouseover', (e) => {
  const row = e.target.closest('#tableBody tr');
  if (!row || row.classList.contains('skeleton-row')) return;
  const nickCell = row.querySelector('.player-cell');
  const idCell = row.querySelector('.id-cell');
  if (!nickCell || !idCell) return;
  const player = allPlayers.find(p => String(p.so2_id) === idCell.textContent.trim());
  if (!player) return;
  miniPopup.innerHTML = `
    <div class="mp-nick">${escapeHtml(player.nick)}</div>
    <div class="mp-row"><span>ELO</span><b>${player.elo}</b></div>
    <div class="mp-row"><span>Matç</span><b>${player.matches}</b></div>
    <div class="mp-row"><span>W/L</span><b>${player.wins}/${player.losses}</b></div>
    <div class="mp-row"><span>Win Rate</span><b>${player.win_rate}%</b></div>
  `;
  miniPopup.style.display = 'block';
});
document.addEventListener('mousemove', (e) => {
  if (miniPopup.style.display !== 'block') return;
  const x = Math.min(e.clientX + 16, window.innerWidth - 200);
  const y = Math.min(e.clientY + 16, window.innerHeight - 120);
  miniPopup.style.left = x + 'px';
  miniPopup.style.top = y + 'px';
});
document.addEventListener('mouseout', (e) => {
  if (e.target.closest('#tableBody tr')) miniPopup.style.display = 'none';
});

// ── Tam Klaviatura Naviqasiyası (a11y) — sətrə Tab+Enter ilə profilə keçid ──
function goToProfileRow(row) {
  const id = row.dataset.discordId;
  if (!id) return;
  startLoadingBar();
  triggerShatter(() => { window.location.href = `/u/${id}`; });
}
document.getElementById('tableBody').addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-discord-id]');
  if (row) goToProfileRow(row);
});
document.getElementById('tableBody').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('tr[data-discord-id]');
  if (!row) return;
  e.preventDefault();
  goToProfileRow(row);
});

// ── Yuxarı yüklənmə zolağı ───────────────────────────────────────────────
const loadingBar = document.getElementById('loadingBar');
function startLoadingBar() {
  loadingBar.classList.add('active');
  loadingBar.style.width = '0%';
  requestAnimationFrame(() => { loadingBar.style.width = '70%'; });
}
function finishLoadingBar() {
  loadingBar.style.width = '100%';
  setTimeout(() => { loadingBar.classList.remove('active'); loadingBar.style.width = '0%'; }, 300);
}

// ── 3D Kart Parçalanma Keçidi — daxili keçidlərdə mozaik-şüşə örtüyü ───────
const shatterOverlay = document.getElementById('shatterOverlay');
for (let i = 0; i < 8 * 6; i++) {
  const shard = document.createElement('div');
  shard.className = 'shard';
  shard.style.transitionDelay = (Math.random() * 220) + 'ms';
  shatterOverlay.appendChild(shard);
}
function triggerShatter(callback) {
  shatterOverlay.classList.add('active');
  setTimeout(callback, 480);
}

// ── Səhifə keçid effekti ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  requestAnimationFrame(() => document.body.classList.add('ready'));
  finishLoadingBar();
});
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a || a.target === '_blank' || a.hostname !== window.location.hostname) return;
  e.preventDefault();
  startLoadingBar();
  triggerShatter(() => { window.location.href = a.href; });
});

// ── Səs Effektləri ───────────────────────────────────────────────────────────
let soundOn = localStorage.getItem('zenith-sound') !== 'off';
const soundToggleEl = document.getElementById('soundToggle');
function updateSoundBtn() {
  soundToggleEl.textContent = soundOn ? '🔊' : '🔇';
  soundToggleEl.classList.toggle('muted', !soundOn);
}
updateSoundBtn();
soundToggleEl.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('zenith-sound', soundOn ? 'on' : 'off');
  updateSoundBtn();
  if (soundOn) playTone(660, 0.06);
});
let audioCtx = null;
function playTone(freq, duration = 0.08, type = 'sine', vol = 0.05) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
    const eqBars = document.getElementById('eqBars');
    if (eqBars) {
      eqBars.classList.add('playing');
      clearTimeout(eqBars._t);
      eqBars._t = setTimeout(() => eqBars.classList.remove('playing'), duration * 1000 + 200);
    }
  } catch (e) { /* sakitcə keç */ }
}
document.addEventListener('click', (e) => {
  if (e.target.closest('button')) {
    playTone(520, 0.05);
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (err) {} }
  }
});

// ── Sürətli Naviqasiya Paneli (Ctrl+K) ───────────────────────────────────────
const cmdPalette = document.getElementById('cmdPalette');
const cmdPaletteInput = document.getElementById('cmdPaletteInput');
const cmdPaletteResults = document.getElementById('cmdPaletteResults');
let cmdSelIdx = -1;
function openPalette() {
  cmdPalette.classList.add('show');
  cmdPaletteInput.value = '';
  cmdPaletteInput.focus();
  renderPaletteResults('');
}
function closePalette() { cmdPalette.classList.remove('show'); }
document.getElementById('paletteBtn').addEventListener('click', openPalette);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openPalette();
  } else if (e.key === 'Escape' && cmdPalette.classList.contains('show')) {
    closePalette();
  }
});
cmdPalette.addEventListener('click', (e) => { if (e.target === cmdPalette) closePalette(); });
function renderPaletteResults(query) {
  const q = query.toLowerCase();
  const matches = allPlayers.filter(p =>
    p.nick.toLowerCase().includes(q) || String(p.so2_id).includes(q)
  ).slice(0, 8);
  cmdSelIdx = -1;
  cmdPaletteResults.innerHTML = matches.map(p =>
    `<div class="cmd-item" data-id="${p.so2_id}"><span>${escapeHtml(p.nick)}</span><span class="elo">${p.elo} ELO</span></div>`
  ).join('') || '<div class="cmd-item">Nəticə tapılmadı</div>';
  cmdPaletteResults.querySelectorAll('.cmd-item[data-id]').forEach(el => {
    el.addEventListener('click', () => {
      window.location.href = `/?me=${encodeURIComponent(el.dataset.id)}`;
    });
  });
}
cmdPaletteInput.addEventListener('input', (e) => renderPaletteResults(e.target.value));
cmdPaletteInput.addEventListener('keydown', (e) => {
  const items = cmdPaletteResults.querySelectorAll('.cmd-item[data-id]');
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdSelIdx = Math.min(cmdSelIdx + 1, items.length - 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdSelIdx = Math.max(cmdSelIdx - 1, 0); }
  else if (e.key === 'Enter' && cmdSelIdx >= 0 && items[cmdSelIdx]) { items[cmdSelIdx].click(); return; }
  else return;
  items.forEach((el, i) => el.classList.toggle('sel', i === cmdSelIdx));
});

async function fetchData() {
  try {
    const res = await fetch('/api/leaderboard');
    const data = await res.json();
    allPlayers = data.players;
    totalMatchesFromServer = data.total_matches;
    render(true);
  } catch (e) {
    console.error('Leaderboard fetch failed', e);
  }
}

// ── Sürüklə-Burax Sütun Sıralaması ─────────────────────────────────────────
const COLUMN_DEFS = {
  rank:    { label: '#',      cell: (p, ctx) => `<td class="rank-cell">#${ctx.rank}${ctx.moveHtml}</td>` },
  player:  { label: 'Player', cell: (p) => `<td class="player-cell">${escapeHtml(p.nick)}</td>` },
  id:      { label: 'SO2 ID', cell: (p) => `<td class="id-cell">${escapeHtml(String(p.so2_id))}</td>` },
  elo:     { label: 'ELO',    cell: (p, ctx) => `<td class="elo-cell${ctx.eloPulseClass}">${p.elo}</td>` },
  matches: { label: 'M',      cell: (p) => `<td>${p.matches}</td>` },
  wins:    { label: 'W',      cell: (p) => `<td>${p.wins}</td>` },
  losses:  { label: 'L',      cell: (p) => `<td>${p.losses}</td>` },
  wr:      { label: 'WR%',    cell: (p) => `<td class="wr-cell">${p.win_rate}%</td>` },
};
let columnOrder = [];
try {
  const saved = JSON.parse(localStorage.getItem('zenith-col-order') || 'null');
  columnOrder = (saved && saved.every(k => COLUMN_DEFS[k])) ? saved : Object.keys(COLUMN_DEFS);
} catch (e) { columnOrder = Object.keys(COLUMN_DEFS); }

let dragSrcKey = null;
function renderTableHead() {
  const headRow = document.getElementById('tableHeadRow');
  headRow.innerHTML = columnOrder.map(key =>
    `<th draggable="true" data-key="${key}">${COLUMN_DEFS[key].label}</th>`
  ).join('');
  headRow.querySelectorAll('th').forEach(th => {
    th.addEventListener('dragstart', (e) => {
      dragSrcKey = th.dataset.key;
      th.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    th.addEventListener('dragend', () => th.classList.remove('dragging'));
    th.addEventListener('dragover', (e) => { e.preventDefault(); th.classList.add('drag-over'); });
    th.addEventListener('dragleave', () => th.classList.remove('drag-over'));
    th.addEventListener('drop', (e) => {
      e.preventDefault();
      th.classList.remove('drag-over');
      const targetKey = th.dataset.key;
      if (!dragSrcKey || dragSrcKey === targetKey) return;
      const from = columnOrder.indexOf(dragSrcKey);
      const to = columnOrder.indexOf(targetKey);
      columnOrder.splice(from, 1);
      columnOrder.splice(to, 0, dragSrcKey);
      localStorage.setItem('zenith-col-order', JSON.stringify(columnOrder));
      renderTableHead();
      render();
    });
  });
}
renderTableHead();

function render(trackRankChanges = false) {
  // Sıra dəyişmə oxları YALNIZ əsl data yeniləməsində (fetchData) müqayisə olunur —
  // axtarış/sıralama dropdown-u ilə görünüş dəyişəndə saxta "sıra dəyişimi" göstərilməsin.
  let filtered = allPlayers.filter(p =>
    (p.nick.toLowerCase().includes(currentSearch.toLowerCase()) ||
     String(p.so2_id).includes(currentSearch)) &&
    (!activeRankFilter || p.rank_name === activeRankFilter)
  );

  filtered.sort((a, b) => b[currentSort] - a[currentSort]);

  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const table = document.getElementById('leaderboardTable');

  if (filtered.length === 0) {
    table.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }
  table.style.display = 'table';
  emptyState.style.display = 'none';

  const newRanks = {};
  const newElos = {};
  const rowsHtml = filtered.map((p, idx) => {
    const rank = idx + 1;
    const rankClass = rank <= 3 ? `rank-${rank}` : '';
    newRanks[p.so2_id] = rank;
    newElos[p.so2_id] = p.elo;

    let moveHtml = '';
    let flashClass = '';
    let eloPulseClass = '';
    if (trackRankChanges) {
      const prevRank = previousRanks[p.so2_id];
      if (firstRenderDone && prevRank !== undefined && prevRank !== rank) {
        if (rank < prevRank) {
          moveHtml = `<span class="rank-move up">▲${prevRank - rank}</span>`;
        } else {
          moveHtml = `<span class="rank-move down">▼${rank - prevRank}</span>`;
        }
        flashClass = ' flash';
      }
      const prevElo = previousElos[p.so2_id];
      if (firstRenderDone && prevElo !== undefined && prevElo !== p.elo) {
        eloPulseClass = p.elo > prevElo ? ' pulse-up' : ' pulse-down';
      }
    }

    const ctx = { rank, moveHtml, eloPulseClass };
    const cellsHtml = columnOrder.map(key => COLUMN_DEFS[key].cell(p, ctx)).join('');
    const tabAttr = p.discord_id ? ` tabindex="0" data-discord-id="${p.discord_id}"` : '';
    return `<tr class="${rankClass}${flashClass}"${tabAttr}>${cellsHtml}</tr>`;
  }).join('');

  tbody.innerHTML = rowsHtml;
  if (trackRankChanges) {
    previousRanks = newRanks;
    previousElos = newElos;
    firstRenderDone = true;
  }

  renderStats(filtered);
  maybeScrollToMe(filtered);
}

// ── "Sən buradasan" scroll — ?me=<so2_id> URL parametri ilə ────────────────
let scrolledToMe = false;
function maybeScrollToMe(filtered) {
  if (scrolledToMe) return;
  const params = new URLSearchParams(window.location.search);
  const meId = params.get('me');
  if (!meId) return;
  const idx = filtered.findIndex(p => String(p.so2_id) === meId);
  if (idx === -1) return;
  const rows = document.querySelectorAll('#tableBody tr');
  const row = rows[idx];
  if (!row) return;
  scrolledToMe = true;
  setTimeout(() => {
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.add('you-are-here');
  }, 150);
}

function renderStats(players) {
  const totalPlayers = allPlayers.length;
  const totalMatches = totalMatchesFromServer;
  const topElo = allPlayers.length ? Math.max(...allPlayers.map(p => p.elo)) : 0;
  const avgElo = allPlayers.length ? Math.round(allPlayers.reduce((s, p) => s + p.elo, 0) / allPlayers.length) : 0;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip"><div class="label">Oyunçular</div><div class="value">${totalPlayers}</div></div>
    <div class="stat-chip"><div class="label">Matçlar</div><div class="value">${Math.round(totalMatches)}</div></div>
    <div class="stat-chip"><div class="label">Ən Yüksək ELO</div><div class="value">${topElo}</div></div>
    <div class="stat-chip"><div class="label">Orta ELO</div><div class="value">${avgElo}</div></div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let searchTrackTimer = null;
document.getElementById('searchInput').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  render();

  // ── Axtarış Sayğacı ("məni kimsə axtaranda") — yazı dayananda 800ms sonra,
  // tam uyğun gələn oyunçular üçün nişanlanır (hər hərfdə deyil) ─────────────
  clearTimeout(searchTrackTimer);
  searchTrackTimer = setTimeout(() => {
    const q = currentSearch.trim().toLowerCase();
    if (q.length < 3) return;
    const matched = allPlayers.filter(p => p.nick.toLowerCase().includes(q) || String(p.so2_id).includes(q));
    if (matched.length === 1) {
      fetch('/api/track_search', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({so2_id: matched[0].so2_id})
      }).catch(() => {});
    }
  }, 800);
});

// ── FLIP Sıralama Animasiyası ────────────────────────────────────────────────
function flipRender() {
  const tbody = document.getElementById('tableBody');
  const oldPositions = {};
  tbody.querySelectorAll('tr').forEach(row => {
    const idCell = row.querySelector('.id-cell');
    if (idCell) oldPositions[idCell.textContent.trim()] = row.getBoundingClientRect().top;
  });
  render();
  tbody.querySelectorAll('tr').forEach(row => {
    const idCell = row.querySelector('.id-cell');
    if (!idCell) return;
    const oldTop = oldPositions[idCell.textContent.trim()];
    if (oldTop === undefined) return;
    const newTop = row.getBoundingClientRect().top;
    const delta = oldTop - newTop;
    if (Math.abs(delta) < 1) return;
    row.style.transition = 'none';
    row.style.transform = `translateY(${delta}px)`;
    requestAnimationFrame(() => {
      row.style.transition = 'transform 0.4s ease-out';
      row.style.transform = '';
    });
  });
}

document.getElementById('sortSelect').addEventListener('change', (e) => {
  currentSort = e.target.value;
  flipRender();
});

// ── Klaviatura qısayolları ─────────────────────────────────────────────────
const searchInputEl = document.getElementById('searchInput');
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInputEl) {
    e.preventDefault();
    searchInputEl.focus();
  } else if (e.key === 'Escape' && document.activeElement === searchInputEl) {
    searchInputEl.value = '';
    currentSearch = '';
    searchInputEl.blur();
    render();
  }
});

// ── Canlı baxanlar sayğacı (heartbeat) ────────────────────────────────────
let viewerSessionId = null;
async function sendHeartbeat() {
  try {
    const r = await fetch('/api/heartbeat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: viewerSessionId})
    });
    const data = await r.json();
    viewerSessionId = data.session_id;
    document.getElementById('viewerCount').textContent = data.viewers;
  } catch (e) { /* sakitcə keç */ }
}
sendHeartbeat();
setInterval(sendHeartbeat, 12000);

// ── Zaman Kapsulu (keçmiş sezonlar) ────────────────────────────────────────
const capsuleToggleBtn = document.getElementById('capsuleToggleBtn');
const capsulePanel = document.getElementById('capsulePanel');
let capsuleLoaded = false;
capsuleToggleBtn.addEventListener('click', async () => {
  const showing = capsulePanel.style.display !== 'none';
  capsulePanel.style.display = showing ? 'none' : 'block';
  if (!showing && !capsuleLoaded) {
    capsuleLoaded = true;
    try {
      const r = await fetch('/api/seasons');
      const seasons = await r.json();
      const listEl = document.getElementById('capsuleList');
      if (!seasons.length) {
        listEl.innerHTML = '<span class="capsule-empty">Hələ bağlanmış sezon yoxdur.</span>';
        return;
      }
      listEl.innerHTML = seasons.map(s =>
        `<div class="capsule-item" data-id="${s.id}">Sezon #${s.season_number} (${s.start_date})</div>`
      ).join('');
      listEl.querySelectorAll('.capsule-item').forEach(el => {
        el.addEventListener('click', () => loadCapsuleDetail(el, seasons));
      });
    } catch (e) {
      document.getElementById('capsuleList').innerHTML = '<span class="capsule-empty">Yüklənə bilmədi.</span>';
    }
  }
});

async function loadCapsuleDetail(el) {
  document.querySelectorAll('.capsule-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  const detailEl = document.getElementById('capsuleDetail');
  detailEl.innerHTML = '<span class="capsule-empty">Yüklənir...</span>';
  try {
    const r = await fetch(`/api/season/${el.dataset.id}`);
    const rows = await r.json();
    if (!rows.length) {
      detailEl.innerHTML = '<span class="capsule-empty">Bu sezonda məlumat yoxdur.</span>';
      return;
    }
    detailEl.innerHTML = rows.map((p, i) =>
      `<div class="capsule-detail-row"><span>#${i + 1} ${escapeHtml(p.nick)}</span><span>${p.elo_gained >= 0 ? '+' : ''}${p.elo_gained} ELO — ${p.wins}Q/${p.losses}M</span></div>`
    ).join('');
  } catch (e) {
    detailEl.innerHTML = '<span class="capsule-empty">Yüklənə bilmədi.</span>';
  }
}

// ── Canlı Matç Ticker ─────────────────────────────────────────────────────
let lastSeenMatchNumber = null;
let matchToastTimer = null;
function showMatchToast(m) {
  const toast = document.getElementById('matchToast');
  toast.innerHTML = `
    <div class="mt-title">🎮 Matç bitdi!</div>
    <div><span style="color:var(--green);font-weight:700;">${escapeHtml(m.winner_nicks.join(', '))}</span> qalib gəldi</div>
    <div style="color:var(--text-dim);">${escapeHtml(m.loser_nicks.join(', '))} qarşısında${m.map ? ' · ' + escapeHtml(m.map) : ''}</div>
  `;
  toast.classList.add('show');
  playTone(700, 0.07);
  clearTimeout(matchToastTimer);
  matchToastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
  blinkTabTitle('🔴 Yeni matç!');
}

// ── Canlı Tab Başlığı — fon rejimdə yeni matç olanda başlıq yanıb-sönür ────
const _originalDocTitle = document.title;
let _blinkInterval = null;
function blinkTabTitle(msg) {
  if (document.hasFocus()) return;
  if (_blinkInterval) return;
  let on = false;
  _blinkInterval = setInterval(() => {
    document.title = on ? _originalDocTitle : msg;
    on = !on;
  }, 1000);
  document.addEventListener('visibilitychange', function stop() {
    if (!document.hidden) {
      clearInterval(_blinkInterval);
      _blinkInterval = null;
      document.title = _originalDocTitle;
      document.removeEventListener('visibilitychange', stop);
    }
  });
}

async function loadTicker() {
  try {
    const r = await fetch('/api/recent_matches');
    const matches = await r.json();
    if (!matches.length) { document.getElementById('ticker').style.display = 'none'; return; }
    const track = document.getElementById('tickerTrack');
    track.innerHTML = matches.map(m =>
      `<span class="ticker-item">Matç #${m.match_number || '?'} · <span class="w">${escapeHtml(m.winner_nicks.join(', '))}</span> ▸ <span class="l">${escapeHtml(m.loser_nicks.join(', '))}</span>${m.map ? ' · ' + escapeHtml(m.map) : ''}</span>`
    ).join('');

    const latest = matches[0];
    if (latest && latest.match_number != null) {
      if (lastSeenMatchNumber !== null && latest.match_number !== lastSeenMatchNumber) {
        showMatchToast(latest);
      }
      lastSeenMatchNumber = latest.match_number;
    }
  } catch (e) { document.getElementById('ticker').style.display = 'none'; }
}
loadTicker();
setInterval(loadTicker, 20000);

// ── Canlı Matç İzləmə Kartı ─────────────────────────────────────────────────
function formatElapsed(createdAt) {
  const secs = Math.max(0, Math.floor(Date.now() / 1000 - createdAt));
  const m = Math.floor(secs / 60), s = secs % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}
async function loadLiveMatches() {
  try {
    const r = await fetch('/api/active_matches');
    const matches = await r.json();
    const wrap = document.getElementById('liveMatchesWrap');
    if (!matches.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = matches.map(m => `
      <div class="live-match-card" data-created="${m.created_at}">
        <span class="lm-badge"><span class="lm-dot"></span>CANLI · Matç #${m.match_number}</span>
        <span class="lm-teams"><b>${escapeHtml((m.team_a || []).join(', ') || '?')}</b> vs <b>${escapeHtml((m.team_b || []).join(', ') || '?')}</b>${m.selected_map ? ' · ' + escapeHtml(m.selected_map) : ''}</span>
        <span class="lm-timer">⏱ <span class="lm-timer-val">${formatElapsed(m.created_at)}</span></span>
      </div>
    `).join('');
  } catch (e) {}
}
loadLiveMatches();
setInterval(loadLiveMatches, 15000);
setInterval(() => {
  document.querySelectorAll('.live-match-card').forEach(card => {
    const val = card.querySelector('.lm-timer-val');

  });
}, 1000);

// ── Mövsümi Tema Overlay (bayram günü qar effekti) ──────────────────────────
fetch('/api/holiday').then(r => r.json()).then(h => {
  if (!h.is_holiday) return;
  const canvas = document.getElementById('snowCanvas');
  canvas.style.display = 'block';
  const sctx = canvas.getContext('2d');
  function resizeSnow() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeSnow);
  resizeSnow();
  const flakes = Array.from({length: 60}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    r: Math.random() * 3 + 1.5, vy: Math.random() * 1 + 0.5, vx: (Math.random() - 0.5) * 0.6
  }));
  function snowLoop() {
    sctx.clearRect(0, 0, canvas.width, canvas.height);
    sctx.fillStyle = 'rgba(255,255,255,0.85)';
    flakes.forEach(f => {
      f.y += f.vy; f.x += f.vx;
      if (f.y > canvas.height) { f.y = -5; f.x = Math.random() * canvas.width; }
      sctx.beginPath();
      sctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      sctx.fill();
    });
    requestAnimationFrame(snowLoop);
  }
  snowLoop();
}).catch(() => {});

// ── Rütbə Bölgüsü (donut chart) ────────────────────────────────────────────
async function loadRankDonut() {
  try {
    const r = await fetch('/api/rank_distribution');
    const dist = await r.json();
    const total = dist.reduce((s, d) => s + d.count, 0);
    const svg = document.getElementById('rankDonut');
    const legend = document.getElementById('donutLegend');
    if (!total) { svg.style.display = 'none'; legend.innerHTML = '<span class="rising-star-empty">Məlumat yoxdur.</span>'; return; }
    const cx = 45, cy = 45, radius = 36, strokeW = 14;
    const circumference = 2 * Math.PI * radius;
    let offset = 0;
    let circles = '';
    let legendHtml = '';
    dist.filter(d => d.count > 0).forEach(d => {
      const frac = d.count / total;
      const dash = frac * circumference;
      const color = `rgb(${d.color.join(',')})`;
      circles += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${color}" stroke-width="${strokeW}"
        stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
      offset += dash;
      legendHtml += `<div class="li"><span class="sw" style="background:${color}"></span>${d.name} (${d.count})</div>`;
    });
    svg.innerHTML = circles;
    legend.innerHTML = legendHtml;
    renderRankChips(dist);
  } catch (e) {}
}
loadRankDonut();

// ── Rütbəyə Görə Filtr Çipləri ─────────────────────────────────────────────
let activeRankFilter = null;
function renderRankChips(dist) {
  const container = document.getElementById('rankFilterChips');
  const withPlayers = dist.filter(d => d.count > 0);
  if (!withPlayers.length) { container.innerHTML = ''; return; }
  container.innerHTML =
    `<div class="rank-chip${activeRankFilter === null ? ' active' : ''}" data-rank="">Hamısı</div>` +
    withPlayers.map(d =>
      `<div class="rank-chip${activeRankFilter === d.name ? ' active' : ''}" data-rank="${escapeHtml(d.name)}" style="${activeRankFilter === d.name ? `border-color: rgb(${d.color.join(',')}); color: rgb(${d.color.join(',')});` : ''}">${escapeHtml(d.name)} (${d.count})</div>`
    ).join('');
  container.querySelectorAll('.rank-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeRankFilter = chip.dataset.rank || null;
      flipRender();
      loadRankDonut();
    });
  });
}

(function autoHideNav() {
  const headerEl = document.querySelector('header');
  let lastY = window.scrollY;

// ── İlk Dəfə Gələnlər üçün Tur ──────────────────────────────────────────────
(function firstVisitTour() {
  if (localStorage.getItem('zenith-tour-done')) return;
  const steps = [
    { sel: '#searchInput', title: '🔍 Axtarış', text: 'Oyunçu adı və ya SO2 ID ilə axtarış edin. "/" düyməsi ilə birbaşa fokuslana bilərsiniz.' },
    { sel: '#sortSelect', title: '↕️ Sıralama', text: 'Cədvəli ELO, qalib, win rate və ya matç sayına görə sıralayın.' },
    { sel: '#rankFilterChips', title: '🏷️ Rütbə Filtri', text: 'Yalnız müəyyən rütbədəki oyunçuları görmək üçün çipə klikləyin.' },
    { sel: '#capsuleToggleBtn', title: '🕰️ Zaman Kapsulu', text: 'Keçmiş sezonların yekun sıralamasına buradan baxa bilərsiniz.' },
    { sel: '#paletteBtn', title: '⌘ Sürətli Axtarış', text: 'Ctrl+K (və ya bu düymə) ilə sürətli oyunçu axtarış paneli açılır.' },
  ];
  let idx = 0;
  const overlay = document.getElementById('tourOverlay');
  function cleanup() {
    document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
    overlay.querySelectorAll('.tour-tip').forEach(el => el.remove());
  }
  function endTour() {
    cleanup();
    overlay.classList.remove('show');
    localStorage.setItem('zenith-tour-done', '1');
  }
  function showStep() {
    cleanup();
    const step = steps[idx];
    const target = document.querySelector(step.sel);
    if (!target) { idx++; if (idx < steps.length) showStep(); else endTour(); return; }
    target.classList.add('tour-highlight');
    const rect = target.getBoundingClientRect();
    const tip = document.createElement('div');
    tip.className = 'tour-tip';
    tip.style.top = (rect.bottom + window.scrollY + 12) + 'px';
    tip.style.left = Math.min(rect.left + window.scrollX, window.innerWidth - 280) + 'px';
    tip.innerHTML = `
      <div class="tt-title">${step.title}</div>
      <div>${step.text}</div>
      <div class="tt-actions">
        <button type="button" class="tt-skip">Keç</button>
        <button type="button" class="tt-next">${idx === steps.length - 1 ? 'Bitir' : 'Növbəti →'}</button>
      </div>
    `;
    overlay.appendChild(tip);
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    tip.querySelector('.tt-skip').addEventListener('click', endTour);
    tip.querySelector('.tt-next').addEventListener('click', () => {
      idx++;
      if (idx < steps.length) showStep(); else endTour();
    });
  }
  setTimeout(() => {
    overlay.classList.add('show');
    idx = 0;
    showStep();
  }, 1200);
})();

fetchData();
